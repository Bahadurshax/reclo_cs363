name: reclo-cs363

services:
  postgres:
    image: postgres:18-alpine
    container_name: reclo-cs363-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reclo
      POSTGRES_PASSWORD: reclo
      POSTGRES_DB: reclo
    ports:
      # Host port 5435 avoids clashing with a Postgres already on 5432.
      - '127.0.0.1:5435:5432'
    volumes:
      # Postgres 18+ keeps its data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reclo -d reclo']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
